<!doctype html>
<html lang="es" class="h-100">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verificar Certificado - AllCursos</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body class="d-flex flex-column h-100" id="page-container">
    <header data-bs-theme="dark">
      <nav class="navbar navbar-expand-lg bg-body-tertiary fixed-top">
        <div class="container-fluid">
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarsExample11"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div
            class="navbar-collapse d-lg-flex justify-content-between collapse show"
            id="navbarsExample11"
          >
            <ul class="navbar-nav fw-bold col-lg-8" id="menuDinamico"></ul>
          </div>
        </div>
      </nav>
    </header>

    <main class="flex-shrink-0">
      <section class="container py-5 mt-5">
        <div class="row justify-content-center">
          <div class="col-md-8 col-lg-6">
            <div class="text-center mb-4">
              <i class="bi bi-patch-check-fill text-primary" style="font-size: 3rem;"></i>
              <h2 class="fw-bold mt-2">Verificar Certificado</h2>
              <p class="text-muted">
                Ingresá el código de verificación que figura al pie del certificado para
                confirmar que es auténtico.
              </p>
            </div>

            <form id="formVerificarCertificado" class="d-flex gap-2 mb-4">
              <input
                type="text"
                class="form-control"
                id="codigoCertificado"
                placeholder="Ej: 4F8A9C2D1B3E"
                required
              />
              <button type="submit" class="btn btn-primary">Verificar</button>
            </form>

            <div id="resultadoVerificacion"></div>
          </div>
        </div>
      </section>
    </main>

    <footer class="text-white bg-black py-3 mt-auto">
      <div class="container text-center">
        <p class="mb-0">&copy; AllCursos 2026</p>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/navbar.js"></script>
    <script src="assets/js/verificar_certificado.js"></script>
  </body>
</html>
