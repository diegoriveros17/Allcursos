<!doctype html>
<html lang="en" class="h-100">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>InfoCursos</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body class="auth-page d-flex flex-column h-100">
    <header data-bs-theme="dark">
      <nav class="navbar navbar-expand-lg" aria-label="Navegación principal">
        <div class="container">
          <a class="navbar-brand brand-infocursos" href="index.html"
            ><i class="bi bi-mortarboard-fill"></i> Info<span>Cursos</span></a
          >
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#mainNavigation"
            aria-controls="mainNavigation"
            aria-expanded="false"
            aria-label="Abrir menú"
          >
            <i class="bi bi-list"></i>
          </button>
          <div class="collapse navbar-collapse" id="mainNavigation">
            <ul
              class="navbar-nav ms-auto align-items-lg-center gap-lg-1"
              id="menuDinamico"
            ></ul>
            <form class="header-search ms-lg-3" role="search" id="formBuscar">
              <label class="visually-hidden" for="terminoBusqueda"
                >Buscar cursos</label
              >
              <i class="bi bi-search"></i
              ><input
                type="search"
                id="terminoBusqueda"
                placeholder="Buscar cursos"
                autocomplete="off"
              />
            </form>
          </div>
        </div>
      </nav>
    </header>

    <main>
      <section
        class="container-fluid d-flex justify-content-center align-items-center"
      >
        <div class="container col-xl-10 col-xxl-8 px-4 py-5">
          <div class="row align-items-center g-lg-5 py-5">
            <div class="col-md-10 mx-auto col-lg-6">
              <form
                class="p-4 p-md-4 border rounded-3 bg-body-tertiary"
                id="formRegistro"
              >
                <div class="row">
                  <div class="col-sm-12">
                    <div class="d-grid justify-content-center gap-2">
                      <label class="form-label fw-bold mb-1"
                        >Seleccione la opción con la que desea
                        registrarse</label
                      >
                      <button
                        type="button"
                        id="btnRolCiudadano"
                        class="btn btn-outline-secondary fw-bold fs-5 py-3"
                      >
                        <i class="bi bi-person-fill fs-2 mb-1"></i>
                        Ciudadano
                      </button>

                      <button
                        type="button"
                        id="btnRolRepresentante"
                        class="btn btn-outline-secondary fw-bold fs-5 py-3"
                      >
                        <i class="bi bi-bank fs-2 mb-1"></i>
                        Representante / Institución
                      </button>

                      <input
                        type="hidden"
                        id="regRol"
                        name="rol"
                        value=""
                        required
                      />
                    </div>
                  </div>

                  <div id="camposFormulario" class="d-none row g-3 m-0 p-0">
                    <div class="col-sm-12">
                      <label for="nombre" class="form-label">Nombres</label>
                      <input
                        type="text"
                        class="form-control"
                        id="nombre"
                        placeholder="Nombre"
                      />
                    </div>

                    <div class="col-sm-12">
                      <label for="apellido" class="form-label">Apellido</label>
                      <input
                        type="text"
                        class="form-control"
                        id="apellido"
                        placeholder="Apellido"
                      />
                    </div>

                    <div class="col-sm-12">
                      <label for="email" class="form-label">Email</label>
                      <input
                        type="email"
                        class="form-control"
                        id="email"
                        placeholder="dfr17@gmail.com"
                      />
                    </div>

                    <div class="col-sm-12">
                      <label for="password" class="form-label"
                        >Contraseña</label
                      >
                      <input
                        type="password"
                        class="form-control"
                        id="password"
                        placeholder="Mínimo 8 caracteres"
                      />
                    </div>

                    <div id="camposCiudadano" class="d-none row g-3 m-0 p-0">
                      <div class="col-sm-12">
                        <label for="dni" class="form-label">Dni</label>
                        <input
                          type="text"
                          class="form-control"
                          id="dni"
                          placeholder="DNI"
                        />
                      </div>
                      <div class="col-sm-12">
                        <label for="address" class="form-label"
                          >Dirección</label
                        >
                        <input
                          type="text"
                          class="form-control"
                          id="address"
                          placeholder="B° Obrero, salta 1250"
                        />
                      </div>
                      <div class="col-sm-12">
                        <label for="canalNotificacion" class="form-label"
                          >¿Cómo querés recibir avisos de cursos nuevos?</label
                        >
                        <select class="form-select" id="canalNotificacion">
                          <option value="Email" selected>
                            Correo electrónico
                          </option>
                          <option value="WhatsApp">WhatsApp</option>
                          <option value="Ambos">Ambos</option>
                        </select>
                      </div>
                    </div>

                    <div id="camposInstitucion" class="d-none row g-3 m-0 p-0">
                      <div class="col-sm-12">
                        <label for="institucionNombre" class="form-label"
                          >Nombre de la Institución/Organismo</label
                        >
                        <input
                          type="text"
                          class="form-control"
                          id="institucionNombre"
                          placeholder="Ej: Instituto de Formación Profesional"
                        />
                      </div>
                      <div class="col-sm-12">
                        <label for="cuit" class="form-label"
                          >CUIT de la Institución</label
                        >
                        <input
                          type="text"
                          class="form-control"
                          id="cuit"
                          placeholder="Ej: 30-12345678-9"
                        />
                      </div>
                      <div class="col-sm-12">
                        <label for="cargo" class="form-label"
                          >Tu cargo en la institución</label
                        >
                        <input
                          type="text"
                          class="form-control"
                          id="cargo"
                          placeholder="Ej: Coordinador de Capacitaciones"
                        />
                      </div>
                    </div>

                    <div class="d-flex justify-content-center w-100">
                      <button class="btn btn-primary mt-3" type="submit">
                        Registrarme
                      </button>
                    </div>

                    <div id="msjRegistro"></div>
                  </div>
                </div>

                <hr class="my-4" />
                <small class="text-warning"
                  >Al hacer click en registrarme acepta los
                  <a href="#">términos y condiciones</a> de uso
                </small>
              </form>
            </div>
          </div>
        </div>
      </section>
    </main>
    <footer class="site-footer">
      <div class="container text-center">© 2026 InfoCursos</div>
    </footer>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>

    <script src="assets/js/api.js"></script>
    <script src="assets/js/navbar.js"></script>
    <script src="assets/js/login.js"></script>
  </body>
</html>
