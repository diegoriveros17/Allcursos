<!doctype html>
<html lang="en" class="h-100">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recuperar contraseña - InfoCursos</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body class="auth-page d-flex flex-column h-100" id="page-container">
    <header data-bs-theme="dark">
      <nav class="navbar navbar-expand-lg" aria-label="Navegación principal">
        <div class="container">
          <a class="navbar-brand brand-infocursos" href="index.html"
            ><i class="bi bi-mortarboard-fill"></i> Info<span>Cursos</span></a
          >
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#mainNavigation"
            aria-controls="mainNavigation"
            aria-expanded="false"
            aria-label="Abrir menú"
          >
            <i class="bi bi-list"></i>
          </button>
          <div class="collapse navbar-collapse" id="mainNavigation">
            <ul
              class="navbar-nav ms-auto align-items-lg-center gap-lg-1"
              id="menuDinamico"
            ></ul>
            <form class="header-search ms-lg-3" role="search" id="formBuscar">
              <label class="visually-hidden" for="terminoBusqueda"
                >Buscar cursos</label
              >
              <i class="bi bi-search"></i
              ><input
                type="search"
                id="terminoBusqueda"
                placeholder="Buscar cursos"
                autocomplete="off"
              />
            </form>
          </div>
        </div>
      </nav>
    </header>

    <main>
      <section
        class="container d-flex justify-content-center align-items-center vh-100"
      >
        <div class="container-fluid col-xl-10 col-xxl-8">
          <div class="row align-items-center g-lg-5">
            <div class="col-md-10 mx-auto col-lg-6">
              <!-- PASO 1: pedir el código -->
              <form
                class="p-md-5 border rounded-3 bg-body-tertiary"
                id="formSolicitarCodigo"
              >
                <h3 class="text-center mb-3">Recuperar contraseña</h3>
                <p class="text-muted text-center small">
                  Ingresá tu email y te enviaremos un código de verificación.
                </p>
                <div class="form-floating mb-3">
                  <input
                    type="email"
                    class="form-control"
                    id="emailRecuperar"
                    placeholder="nombre@ejemplo.com"
                    required
                  />
                  <label for="emailRecuperar">Correo Electrónico</label>
                </div>
                <div class="d-flex justify-content-center">
                  <button class="btn btn-primary" type="submit">
                    Enviar código
                  </button>
                </div>
                <div id="msjSolicitarCodigo" class="mt-3"></div>
              </form>

              <!-- PASO 2: ingresar código + nueva contraseña -->
              <form
                class="p-md-5 border rounded-3 bg-body-tertiary d-none"
                id="formConfirmarCodigo"
              >
                <h3 class="text-center mb-3">Ingresá el código</h3>
                <p class="text-muted text-center small">
                  Revisá tu correo (o la consola del servidor si estás en modo
                  desarrollo) y completá el código de 6 dígitos.
                </p>
                <div class="form-floating mb-3">
                  <input
                    type="text"
                    class="form-control"
                    id="codigoRecuperar"
                    placeholder="123456"
                    maxlength="6"
                    required
                  />
                  <label for="codigoRecuperar">Código de verificación</label>
                </div>
                <div class="form-floating mb-3">
                  <input
                    type="password"
                    class="form-control"
                    id="passwordNueva"
                    placeholder="Nueva contraseña"
                    required
                  />
                  <label for="passwordNueva">Nueva contraseña</label>
                </div>
                <div class="d-flex justify-content-center">
                  <button class="btn btn-success" type="submit">
                    Cambiar contraseña
                  </button>
                </div>
                <div id="msjConfirmarCodigo" class="mt-3"></div>
              </form>

              <div class="text-center mt-3">
                <a href="login.html" class="small">Volver a Iniciar Sesión</a>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>
    <footer class="site-footer mt-auto">
      <div class="container text-center">© 2026 InfoCursos</div>
    </footer>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/navbar.js"></script>
    <script src="assets/js/recuperar_contrasena.js"></script>
  </body>
</html>
