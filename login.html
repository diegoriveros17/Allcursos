<!doctype html>
<html lang="en" class="h-100">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>InfoCursos</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body class="d-flex flex-column h-100" id="page-container">
    <header data-bs-theme="dark">
      <nav class="navbar navbar-expand-lg bg-body-tertiary fixed-top border-bottom border-secondary border-opacity-25">
        <div class="container-fluid">
          <a class="navbar-brand brand-infocursos" href="index.html">
            <span class="brand-icon">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 3L1 8l11 5 9-4.09V17h2V8L12 3z" fill="currentColor"/>
                <path d="M5 13.18v3.6L12 21l7-4.22v-3.6L12 17l-7-3.82z" fill="currentColor" opacity="0.65"/>
              </svg>
            </span>
            <span>Info<span class="brand-accent">Cursos</span></span>
          </a>
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarsExample11"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div
            class="navbar-collapse d-lg-flex justify-content-between collapse show"
            id="navbarsExample11"
          >
            <!-- Lista de navegación común -->
            <ul class="navbar-nav fw-bold col-lg-8" id="menuDinamico">
              <!-- El contenido se genera por JS -->
            </ul>
          </div>
        </div>
      </nav>
    </header>

    <main class="flex-shrink-0 d-flex align-items-center justify-content-center">
      <section class="container vh-100 d-flex justify-content-center align-items-center">
        <div class="col-xl-5 col-lg-6 col-md-8 mx-auto">
          <form class="p-4 p-md-5 rounded-4 shadow-lg" id="formLogin">
            <div class="text-center mb-4">
              <h3 class="fw-bold text-light">Bienvenido a InfoCursos <i class="bi bi-backpack3-fill"></i></h3>
              <p class="text-warning">Ingresa tus credenciales para continuar</p>
            </div>

            <div class="form-floating mb-3">
              <input
                type="text"
                class="form-control"
                id="user"
                placeholder="nombre@ejemplo.com"
              />
              <label for="user">Email o DNI</label>
            </div>

            <div class="form-floating mb-3 position-relative">
  <input
    type="password"
    class="form-control"
    id="password"
    placeholder="Contraseña"
  />
  <label for="password">Contraseña</label>
  
  <!-- Contenedor del ojo posicionado de forma absoluta a la derecha -->
  <span id="togglePassword" style="cursor: pointer; position: absolute; right: 15px; top: 50%; transform: translateY(-50%); z-index: 10;">
    <i class="bi bi-eye" id="iconEye"></i>
  </span>
</div>

            <div class="d-flex justify-content-between align-items-center mb-4">
              <div class="form-check">
                <input type="checkbox" class="form-check-input" id="remember" />
                <label class="form-check-label text-warning" for="remember">Recordarme</label>
              </div>
              <a href="recuperar_contrasena.html" class="small text-decoration-none text-warning">¿Olvidaste tu contraseña?</a>
            </div>

            <div class="d-grid">
              <button class="btn btn-primary btn-lg" type="submit" id="btnLogin">
                Iniciar Sesión
              </button>
            </div>

            <div id="msjConfirmacion"></div>
          </form>
        </div>
      </section>
    </main>

    <footer class="text-white bg-black py-3 mt-auto border-top border-secondary border-opacity-25">
      <div class="container text-center">
        <p class="mb-0 small">&copy; AllCursos 2026</p>
      </div>
    </footer>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/navbar.js"></script>
    <script src="assets/js/login.js"></script>
  </body>
</html>
