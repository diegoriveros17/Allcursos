<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iniciar sesión | InfoCursos</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body id="page-container" class="auth-page d-flex flex-column min-vh-100">
    <header data-bs-theme="dark">
      <nav class="navbar navbar-expand-lg" aria-label="Navegación principal">
        <div class="container">
          <a class="navbar-brand brand-infocursos" href="index.html"
            ><i class="bi bi-mortarboard-fill"></i> Info<span>Cursos</span></a
          >
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#mainNavigation"
            aria-controls="mainNavigation"
            aria-expanded="false"
            aria-label="Abrir menú"
          >
            <i class="bi bi-list"></i>
          </button>
          <div class="collapse navbar-collapse" id="mainNavigation">
            <ul
              class="navbar-nav ms-auto align-items-lg-center gap-lg-1"
              id="menuDinamico"
            ></ul>
            <form class="header-search ms-lg-3" role="search" id="formBuscar">
              <label class="visually-hidden" for="terminoBusqueda"
                >Buscar cursos</label
              >
              <i class="bi bi-search"></i
              ><input
                type="search"
                id="terminoBusqueda"
                placeholder="Buscar cursos"
                autocomplete="off"
              />
            </form>
          </div>
        </div>
      </nav>
    </header>
    <main class="flex-grow-1 d-flex align-items-center py-5">
      <section class="container">
        <div class="row justify-content-center">
          <div class="col-md-8 col-lg-5">
            <form class="p-4 p-md-5" id="formLogin">
              <div class="text-center mb-4">
                <span class="eyebrow"
                  ><i class="bi bi-shield-check"></i> Acceso seguro</span
                >
                <h1 class="auth-title mt-3">Qué bueno verte de nuevo</h1>
                <p class="text-muted mb-0">
                  Ingresá tus datos para continuar aprendiendo.
                </p>
              </div>
              <div class="form-floating mb-3">
                <input
                  type="text"
                  class="form-control"
                  id="user"
                  placeholder="nombre@ejemplo.com"
                  required
                /><label for="user">Email o DNI</label>
              </div>
              <div class="form-floating mb-3 position-relative">
                <input
                  type="password"
                  class="form-control"
                  id="password"
                  placeholder="Contraseña"
                  required
                /><label for="password">Contraseña</label
                ><button
                  class="btn btn-sm position-absolute end-0 top-50 translate-middle-y border-0 me-2"
                  type="button"
                  id="togglePassword"
                  aria-label="Mostrar contraseña"
                >
                  <i class="bi bi-eye" id="iconEye"></i>
                </button>
              </div>
              <div
                class="d-flex justify-content-between align-items-center mb-4"
              >
                <div class="form-check">
                  <input
                    type="checkbox"
                    class="form-check-input"
                    id="remember"
                  /><label class="form-check-label small" for="remember"
                    >Recordarme</label
                  >
                </div>
                <a
                  href="recuperar_contrasena.html"
                  class="small text-decoration-none"
                  >¿Olvidaste tu contraseña?</a
                >
              </div>
              <button
                class="btn btn-brand btn-lg w-100"
                type="submit"
                id="btnLogin"
              >
                Iniciar sesión <i class="bi bi-arrow-right"></i>
              </button>
              <p class="text-center text-muted small mt-4 mb-0">
                ¿Todavía no tenés cuenta?
                <a
                  href="formulario_registro.html"
                  class="fw-bold text-decoration-none"
                  >Registrate gratis</a
                >
              </p>
              <div id="msjConfirmacion"></div>
            </form>
          </div>
        </div>
      </section>
    </main>
    <footer class="site-footer">
      <div class="container text-center">© 2026 InfoCursos</div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/navbar.js"></script>
    <script src="assets/js/login.js"></script>
  </body>
</html>
