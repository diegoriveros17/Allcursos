<!doctype html>
<html lang="en" class="h-100">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AllCursos</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="assets/css/style.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
  </head>
  <body class="d-flex flex-column h-100" id="page-container-1">
    <header data-bs-theme="light">
      <nav
        class="navbar navbar-expand-lg bg-body-tertiary fixed-top border-bottom shadow-sm"
        aria-label="Thirteenth navbar example"
      >
        <div class="container-fluid">
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarsExample11"
            aria-controls="navbarsExample11"
            aria-expanded="true"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div
            class="navbar-collapse d-lg-flex justify-content-between collapse show"
            id="navbarsExample11"
          >
            <ul class="navbar-nav col-lg-6" id="menuDinamico">
              <!-- Generado dinámicamente por navbar.js según haya o no sesión -->
            </ul>
            <div class="col-lg-4">
              <form class="d-flex" role="search" id="formBuscar">
                <input
                  class="form-control me-2"
                  type="search"
                  placeholder="Buscar"
                  aria-label="Search"
                  name="terminoBusqueda"
                  id="terminoBusqueda"
                />
                <button class="btn btn-outline-success" type="submit">
                  Buscar
                </button>
              </form>
            </div>
          </div>
        </div>
      </nav>
    </header>
    <main>
      <section class="py-3 text-center container">
        <div class="container my-5">
          <div id="contenedorDetalle"></div>
        </div>
      </section>
    </main>

    <!-- MODAL REPORTAR CURSO -->
    <div class="modal fade" id="modalReportarCurso" tabindex="-1" aria-labelledby="modalReportarLabel" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header bg-danger text-white">
            <h5 class="modal-title" id="modalReportarLabel"><i class="bi bi-flag-fill me-2"></i>Reportar este curso</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body text-start">
            <div id="msjReporte"></div>
            <form id="formReportarCurso">
              <div class="mb-3">
                <label for="reporteMotivo" class="form-label fw-semibold">Motivo del reporte</label>
                <select class="form-select" id="reporteMotivo" required>
                  <option value="">Selecciona un motivo...</option>
                  <option value="Contenido engañoso">Contenido engañoso</option>
                  <option value="Spam o publicidad">Spam o publicidad</option>
                  <option value="Datos de contacto falsos">Datos de contacto falsos</option>
                  <option value="Discriminatorio o inapropiado">Discriminatorio o inapropiado</option>
                  <option value="Otro">Otro motivo</option>
                </select>
              </div>
              <div class="mb-3">
                <label for="reporteDescripcion" class="form-label fw-semibold">Descripción del problema</label>
                <textarea class="form-control" id="reporteDescripcion" rows="3" placeholder="Explica detalladamente qué problema encontraste..." required></textarea>
              </div>
              <div class="mb-3" id="campoEmailReporte">
                <label for="reporteEmail" class="form-label fw-semibold">Tu email de contacto (opcional)</label>
                <input type="email" class="form-control" id="reporteEmail" placeholder="tu@email.com">
              </div>
              <div class="d-flex justify-content-end gap-2">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button type="submit" class="btn btn-danger" id="btnEnviarReporte">Enviar Reporte</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
    <footer class="bg-white border-top py-4 mt-auto">
      <div class="container text-center">
        <p class="mb-0 fw-semibold text-dark">&copy; AllCursos 2026</p>
      </div>
    </footer>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>

    <script src="assets/js/api.js"></script>
    <script src="assets/js/navbar.js"></script>
    <script src="assets/js/detalles.js"></script>
    <script src="assets/js/chatbot.js"></script>
  </body>
</html>
