<!doctype html>
<html lang="es" class="h-100">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alumnos del curso - AllCursos</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" /> <!-- Adelanta la conexión con Google Fonts para que las letras carguen antes -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="assets/css/style.css" /> <!-- Tema visual común (colores, tipografías, animaciones) -->
  </head>
  <body class="d-flex flex-column h-100 bg-light">
    <header data-bs-theme="light">
      <nav class="navbar navbar-expand-lg bg-body-tertiary fixed-top border-bottom shadow-sm">
        <div class="container-fluid">
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarsExample11"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div
            class="navbar-collapse d-lg-flex justify-content-between collapse show"
            id="navbarsExample11"
          >
            <ul class="navbar-nav col-lg-8" id="menuDinamico"></ul>
          </div>
        </div>
      </nav>
    </header>

    <main class="flex-shrink-0">
      <!-- CABECERA: el curso del que se ven los alumnos -->
      <section class="hero-banner panel-hero alumnos-hero">
        <div class="container">
          <a href="dashboard.html" class="btn btn-hero-borde btn-sm mb-3"><i class="bi bi-arrow-left me-1"></i>Volver al panel</a>
          <div class="panel-hero-contenido">
            <div class="alumnos-curso-imagen" id="imagenCursoAlumnos"><i class="bi bi-mortarboard"></i></div>
            <div class="panel-hero-texto">
              <span class="panel-momento">Gestión de alumnos</span>
              <h1 id="nombreCursoTitulo">Cargando el curso...</h1>
              <div class="panel-chips" id="chipsCursoAlumnos"></div>
            </div>
          </div>
        </div>
      </section>

      <div class="container pb-5">
        <!-- Métricas del curso -->
        <div class="row g-3 panel-metricas" id="metricasAlumnos"></div>

        <section class="panel-card mt-4">
          <div class="panel-card-cabecera">
            <span class="panel-card-icono"><i class="bi bi-people-fill"></i></span>
            <div class="flex-grow-1">
              <h2 class="panel-card-titulo">Alumnos inscriptos</h2>
              <p class="panel-card-sub">Mirá el perfil de cada alumno, contactalo y marcá quién terminó el curso.</p>
            </div>
          </div>
          <div class="barra-herramientas">
            <div class="buscador-panel">
              <i class="bi bi-search"></i>
              <input type="search" class="form-control form-control-sm" id="buscarAlumno" placeholder="Buscar por nombre, DNI o email..." autocomplete="off" />
            </div>
            <div class="pildoras-filtro" id="filtrosAlumnos" role="tablist"></div>
          </div>
          <div class="panel-card-cuerpo pt-0">
            <div class="row g-3" id="listaAlumnos">
              <div class="col-12 text-center text-muted py-4"><span class="spinner-border spinner-border-sm me-2"></span>Cargando alumnos...</div>
            </div>
          </div>
        </section>
      </div>
    </main>

    <!-- PERFIL DEL ALUMNO (lo completa alumnos_curso.js) -->
    <div class="modal fade" id="modalContactoAlumno" tabindex="-1" aria-labelledby="modalContactoLabel" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content border-0 overflow-hidden" id="cuerpoModalContacto"></div>
      </div>
    </div>

    <footer class="bg-white border-top py-4 mt-auto">
      <div class="container text-center">
        <p class="mb-0 fw-semibold text-dark">&copy; AllCursos 2026</p>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/dom_utils.js"></script>
    <script src="assets/js/navbar.js"></script>
    <script src="assets/js/ui.js"></script> <!-- Efectos visuales comunes (scroll, volver arriba) -->
    <script src="assets/js/alumnos_curso.js"></script>
    <script src="assets/js/chatbot.js"></script>
  </body>
</html>
