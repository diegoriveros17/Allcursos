<!doctype html>
<html lang="es" class="h-100">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recuperar contraseña - AllCursos</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" /> <!-- Adelanta la conexión con Google Fonts para que las letras carguen antes -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="assets/css/style.css" />
    <link rel="stylesheet" href="assets/css/tema_fondos.css" /> <!-- Fondos en tonos suaves (borrar esta línea para volver al blanco) -->
  </head>
  <body class="d-flex flex-column h-100" id="page-container">
    <header data-bs-theme="light">
      <nav class="navbar navbar-expand-lg bg-body-tertiary fixed-top border-bottom shadow-sm">
        <div class="container-fluid">
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarsExample11"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div
            class="navbar-collapse d-lg-flex justify-content-between collapse show"
            id="navbarsExample11"
          >
            <ul class="navbar-nav col-lg-8" id="menuDinamico"></ul>
          </div>
        </div>
      </nav>
    </header>

    <main class="pagina-auth">
      <section class="container">
        <div class="auth-tarjeta auth-compacta">
          <div class="auth-formulario">
            <!-- PASO 1: pedir el código -->
            <form id="formSolicitarCodigo">
              <span class="auth-icono-cabecera"><i class="bi bi-key"></i></span>
              <h1 class="auth-titulo text-center">Recuperar contraseña</h1>
              <p class="auth-subtitulo text-center">
                Ingresá tu email y te enviaremos un código de verificación.
              </p>
              <div class="mb-4">
                <label for="emailRecuperar" class="form-label">Correo electrónico</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                  <input
                    type="email"
                    class="form-control"
                    id="emailRecuperar"
                    placeholder="nombre@ejemplo.com"
                    autocomplete="email"
                    required
                  />
                </div>
              </div>
              <button class="btn btn-auth w-100" type="submit">
                Enviar código<i class="bi bi-send ms-2"></i>
              </button>
              <div id="msjSolicitarCodigo" class="mt-3"></div>
            </form>

            <!-- PASO 2: ingresar código + nueva contraseña -->
            <form class="d-none" id="formConfirmarCodigo">
              <span class="auth-icono-cabecera"><i class="bi bi-shield-lock"></i></span>
              <h1 class="auth-titulo text-center">Ingresá el código</h1>
              <p class="auth-subtitulo text-center">
                Revisá tu correo (o la consola del servidor si estás en modo
                desarrollo) y completá el código de 6 dígitos.
              </p>
              <div class="mb-3">
                <label for="codigoRecuperar" class="form-label">Código de verificación</label>
                <input
                  type="text"
                  class="form-control text-center fw-bold fs-5 input-codigo"
                  id="codigoRecuperar"
                  placeholder="••••••"
                  maxlength="6"
                  inputmode="numeric"
                  autocomplete="one-time-code"
                  required
                />
              </div>
              <div class="mb-4">
                <label for="passwordNueva" class="form-label">Nueva contraseña</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-lock"></i></span>
                  <input
                    type="password"
                    class="form-control"
                    id="passwordNueva"
                    placeholder="Mínimo 8 caracteres"
                    autocomplete="new-password"
                    data-fuerza
                    required
                  />
                </div>
              </div>
              <button class="btn btn-auth w-100" type="submit">
                Cambiar contraseña<i class="bi bi-check2 ms-2"></i>
              </button>
              <div id="msjConfirmarCodigo" class="mt-3"></div>
            </form>

            <div class="text-center mt-4">
              <a href="login.html" class="small enlace-auth"><i class="bi bi-arrow-left me-1"></i>Volver a iniciar sesión</a>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/navbar.js"></script>
    <script src="assets/js/ui.js"></script> <!-- Efectos visuales comunes (scroll, volver arriba) -->
    <script src="assets/js/recuperar_contrasena.js"></script>
  </body>
</html>
