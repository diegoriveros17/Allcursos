<!doctype html>
<html lang="es" class="h-100">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mi Cuenta - AllCursos</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="assets/css/style.css" />
</head>
  <body class="d-flex flex-column h-100" id="page-container">
    <header data-bs-theme="light">
      <nav class="navbar navbar-expand-lg bg-body-tertiary fixed-top border-bottom shadow-sm">
        <div class="container-fluid">
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarsExample11"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div
            class="navbar-collapse d-lg-flex justify-content-between collapse show"
            id="navbarsExample11"
          >
            <ul class="navbar-nav col-lg-8" id="menuDinamico"></ul>
          </div>
        </div>
      </nav>
    </header>

    <main class="flex-shrink-0">
      <div class="container py-5 mt-5">
        <div class="mb-4">
          <a href="dashboard.html" class="text-decoration-none text-muted small">
            <i class="bi bi-arrow-left me-1"></i>Volver a mi panel
          </a>
          <h2 class="fw-bold mt-2 mb-0">Mi Cuenta</h2>
          <p class="text-muted">Gestioná tu foto, tus datos, tu contraseña y tu cuenta.</p>
        </div>

        <div class="row g-4">
          <!-- FOTO DE PERFIL -->
          <div class="col-lg-3">
            <div class="card border-0 shadow-sm">
              <div class="card-body text-center py-4">
                <img
                  id="avatarPreview"
                  src="assets/img/avatar_default.svg"
                  alt="Foto de perfil"
                  class="rounded-circle mb-3"
                  style="width: 110px; height: 110px; object-fit: cover; border: 3px solid var(--brand-border);"
                />
                <form id="formAvatar">
                  <label for="inputAvatar" class="btn btn-sm btn-outline-secondary w-100">
                    <i class="bi bi-camera-fill me-1"></i>Cambiar foto
                  </label>
                  <input type="file" id="inputAvatar" accept="image/png, image/jpeg, image/webp" class="d-none" />
                  <div class="form-text">JPG, PNG o WEBP. Máx. 2MB.</div>
                </form>
              </div>
            </div>
          </div>

          <!-- TABS: DATOS / CONTRASEÑA / ELIMINAR -->
          <div class="col-lg-9">
            <div class="card border-0 shadow-sm">
              <div class="card-body">
                <ul class="nav nav-tabs" role="tablist">
                  <li class="nav-item" role="presentation">
                    <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tabDatos" type="button">
                      Mis Datos
                    </button>
                  </li>
                  <li class="nav-item" role="presentation">
                    <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tabPassword" type="button">
                      Contraseña
                    </button>
                  </li>
                  <li class="nav-item" role="presentation">
                    <button class="nav-link text-danger" data-bs-toggle="tab" data-bs-target="#tabEliminar" type="button">
                      Eliminar cuenta
                    </button>
                  </li>
                </ul>

                <div class="tab-content pt-4">
                  <!-- TAB: DATOS -->
                  <div class="tab-pane fade show active" id="tabDatos">
                    <div id="msjCuentaDatos"></div>
                    <form id="formCuentaDatos">
                      <div class="row g-3">
                        <div class="col-md-6">
                          <label for="cuentaNombre" class="form-label fw-semibold">Nombre</label>
                          <input type="text" class="form-control" id="cuentaNombre" required />
                        </div>
                        <div class="col-md-6">
                          <label for="cuentaApellido" class="form-label fw-semibold">Apellido</label>
                          <input type="text" class="form-control" id="cuentaApellido" required />
                        </div>
                        <div class="col-md-6">
                          <label for="cuentaTelefono" class="form-label fw-semibold">Teléfono</label>
                          <input type="tel" class="form-control" id="cuentaTelefono" />
                        </div>
                        <div class="col-md-6">
                          <label for="cuentaEmail" class="form-label fw-semibold">Email de acceso</label>
                          <input type="email" class="form-control" id="cuentaEmail" required />
                        </div>
                        <div class="col-md-6 d-none" id="grupoCuentaInstitucion">
                          <label for="cuentaInstitucionNombre" class="form-label fw-semibold">Nombre de la institución</label>
                          <input type="text" class="form-control" id="cuentaInstitucionNombre" />
                        </div>
                        <div class="col-md-6 d-none" id="grupoCuentaCuit">
                          <label for="cuentaInstitucionCuit" class="form-label fw-semibold">CUIT</label>
                          <input type="text" class="form-control" id="cuentaInstitucionCuit" />
                        </div>
                      </div>
                      <div class="mt-4 d-flex justify-content-end">
                        <button type="submit" class="btn btn-primary">Guardar Cambios</button>
                      </div>
                    </form>
                  </div>

                  <!-- TAB: CONTRASEÑA -->
                  <div class="tab-pane fade" id="tabPassword">
                    <div id="msjCuentaPassword"></div>
                    <form id="formCuentaPassword">
                      <div class="row g-3">
                        <div class="col-12">
                          <label for="cuentaPasswordActual" class="form-label fw-semibold">Contraseña actual</label>
                          <input type="password" class="form-control" id="cuentaPasswordActual" required />
                        </div>
                        <div class="col-md-6">
                          <label for="cuentaPasswordNueva" class="form-label fw-semibold">Nueva contraseña</label>
                          <input type="password" class="form-control" id="cuentaPasswordNueva" required minlength="4" />
                        </div>
                        <div class="col-md-6">
                          <label for="cuentaPasswordConfirmar" class="form-label fw-semibold">Confirmar nueva contraseña</label>
                          <input type="password" class="form-control" id="cuentaPasswordConfirmar" required minlength="4" />
                        </div>
                      </div>
                      <div class="mt-4 d-flex justify-content-end">
                        <button type="submit" class="btn btn-primary">Cambiar Contraseña</button>
                      </div>
                    </form>
                  </div>

                  <!-- TAB: ELIMINAR CUENTA (v2.3: sólo motivo por radio; el detalle aparece únicamente con "Otro motivo") -->
                  <div class="tab-pane fade" id="tabEliminar"> <!-- Panel de la pestaña Eliminar cuenta -->
                    <div class="alert alert-warning"> <!-- Aviso amarillo -->
                      Al eliminar tu cuenta, se desactivará tu acceso a la plataforma. <!-- Texto del aviso -->
                    </div> <!-- Cierra el aviso -->
                    <div id="msjCuentaEliminar"></div> <!-- Acá se muestran los errores -->
                    <form id="formCuentaEliminar"> <!-- Formulario de baja -->
                      <p class="fw-semibold mb-2">¿Por qué querés eliminar tu cuenta?</p> <!-- Pregunta del motivo -->
                      <div class="mb-3"> <!-- Grupo de opciones (radio buttons: se puede elegir sólo una) -->
                        <div class="form-check"> <!-- Opción 1 -->
                          <input class="form-check-input" type="radio" name="motivoBaja" id="motivo1" value="no_uso_la_plataforma"> <!-- Radio con el valor que valida el backend -->
                          <label class="form-check-label" for="motivo1">Casi no uso la plataforma</label> <!-- Texto de la opción 1 -->
                        </div> <!-- Cierra opción 1 -->
                        <div class="form-check"> <!-- Opción 2 -->
                          <input class="form-check-input" type="radio" name="motivoBaja" id="motivo2" value="encontre_otra_alternativa"> <!-- Radio opción 2 -->
                          <label class="form-check-label" for="motivo2">Encontré otra alternativa</label> <!-- Texto de la opción 2 -->
                        </div> <!-- Cierra opción 2 -->
                        <div class="form-check"> <!-- Opción 3 -->
                          <input class="form-check-input" type="radio" name="motivoBaja" id="motivo3" value="problemas_tecnicos"> <!-- Radio opción 3 -->
                          <label class="form-check-label" for="motivo3">Tuve problemas técnicos</label> <!-- Texto de la opción 3 -->
                        </div> <!-- Cierra opción 3 -->
                        <div class="form-check"> <!-- Opción 4 -->
                          <input class="form-check-input" type="radio" name="motivoBaja" id="motivo4" value="dificil_de_usar"> <!-- Radio opción 4 -->
                          <label class="form-check-label" for="motivo4">Me resultó difícil de usar</label> <!-- Texto de la opción 4 -->
                        </div> <!-- Cierra opción 4 -->
                        <div class="form-check"> <!-- Opción 5 -->
                          <input class="form-check-input" type="radio" name="motivoBaja" id="motivo5" value="privacidad"> <!-- Radio opción 5 -->
                          <label class="form-check-label" for="motivo5">Me preocupa mi privacidad</label> <!-- Texto de la opción 5 -->
                        </div> <!-- Cierra opción 5 -->
                        <div class="form-check"> <!-- Opción 6 -->
                          <input class="form-check-input" type="radio" name="motivoBaja" id="motivo6" value="otro"> <!-- Radio opción 6 -->
                          <label class="form-check-label" for="motivo6">Otro motivo</label> <!-- Texto de la opción 6 -->
                        </div> <!-- Cierra opción 6 -->
                      </div> <!-- Cierra el grupo de radios -->
                      <div class="mb-3 d-none" id="grupoMotivoOtro"> <!-- Grupo oculto: el JS lo muestra sólo si se elige "Otro motivo" -->
                        <label for="motivoOtroTexto" class="form-label fw-semibold">¿Cuál fue el motivo?</label> <!-- Etiqueta del campo -->
                        <input type="text" class="form-control" id="motivoOtroTexto" maxlength="255" placeholder="Escribí brevemente el motivo" /> <!-- Campo de una línea para el motivo específico (máximo 255 caracteres) -->
                      </div> <!-- Cierra el grupo del motivo "Otro" -->
                      <div class="mb-3"> <!-- Grupo de la contraseña -->
                        <label for="cuentaPasswordEliminar" class="form-label fw-semibold">Confirmá tu contraseña para continuar</label> <!-- Etiqueta -->
                        <input type="password" class="form-control" id="cuentaPasswordEliminar" required /> <!-- Campo contraseña obligatorio -->
                      </div> <!-- Cierra el grupo -->
                      <div class="d-flex justify-content-end"> <!-- Contenedor del botón -->
                        <button type="submit" class="btn btn-danger">Eliminar mi cuenta</button> <!-- Botón que abre el modal de confirmación -->
                      </div> <!-- Cierra el contenedor -->
                    </form> <!-- Cierra el formulario -->
                  </div> <!-- Cierra el panel Eliminar cuenta -->
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <footer class="bg-white border-top py-4 mt-auto">
      <div class="container text-center">
        <p class="mb-0 fw-semibold text-dark">&copy; AllCursos 2026</p>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/api.js"></script> <!-- Funciones comunes (apiFetch, toasts) -->
    <script src="assets/js/navbar.js"></script>
    <script src="assets/js/configuracion.js"></script>
  </body>
</html>
