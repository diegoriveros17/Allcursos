<!doctype html>
<html lang="en" class="h-100">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>InfoCursos</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body class="d-flex flex-column h-100" id="page-container-1">
    <header data-bs-theme="light">
      <nav class="navbar navbar-expand-lg bg-body-tertiary fixed-top border-bottom shadow-sm">
        <div class="container-fluid">
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarsExample11"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div
            class="navbar-collapse d-lg-flex justify-content-between collapse show"
            id="navbarsExample11"
          >
            <!-- Lista de navegación común -->
            <ul class="navbar-nav col-lg-8" id="menuDinamico">
              <!-- El contenido de aquí adentro se va a generar solo por JavaScript en todas las páginas -->
            </ul>
          </div>
        </div>
      </nav>
    </header>

    <main>
      <!-- Banner simple, sin imagen de fondo: liviano y sobrio -->
      <section class="hero-banner text-white">
        <div class="container py-5 mt-4">
          <div class="row">
            <div class="col-lg-7">
              <span class="badge mb-3 px-3 py-2" style="background-color: rgba(255,255,255,.15); letter-spacing: .04em;">
                PLATAFORMA DE CAPACITACIÓN
              </span>
              <h1 class="fw-bold mb-3" style="font-size: clamp(1.9rem, 3.4vw, 2.6rem);">
                Formación profesional, al alcance de todos
              </h1>
              <p class="mb-4 text-white-50" style="max-width: 34rem;">
                Encontrá cursos de instituciones de tu ciudad, inscribite en minutos
                y descargá tu certificado al finalizar.
              </p>
              <a href="#cursos" class="btn btn-outline-gold">Explorar cursos disponibles</a>
            </div>
          </div>
        </div>
      </section>

      <section class="py-3 text-center container" id="cursos">
        <div class="album py-5">
          <div class="container">
            <!-- Buscador + filtros, todos juntos -->
            <div class="row g-2 justify-content-center mb-4">
              <div class="col-12 col-md-4">
                <div class="input-group">
                  <span class="input-group-text bg-white"><i class="bi bi-search"></i></span>
                  <input
                    class="form-control"
                    type="search"
                    placeholder="Buscar por título, institución o categoría..."
                    id="terminoBusqueda"
                  />
                </div>
              </div>
              <div class="col-6 col-md-3">
                <select class="form-select" id="filtroCategoria">
                  <option value="">Todas las categorías</option>
                </select>
              </div>
              <div class="col-6 col-md-3">
                <select class="form-select" id="filtroModalidad">
                  <option value="">Todas las modalidades</option>
                  <option value="Presencial">Presencial</option>
                  <option value="Virtual">Virtual</option>
                  <option value="Híbrido">Híbrido</option>
                </select>
              </div>
              <div class="col-6 col-md-auto">
                <button class="btn btn-outline-secondary w-100" type="button" id="btnLimpiarFiltros">
                  Limpiar
                </button>
              </div>
            </div>

            <div class="row g-3" id="cardCursos"></div>
          </div>
        </div>
      </section>
    </main>
    <footer class="bg-white border-top py-4 mt-auto">
      <div class="container text-center">
        <p class="mb-0 fw-semibold text-dark">&copy; AllCursos 2026</p>
      </div>
    </footer>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/navbar.js"></script>
    <script src="assets/js/app.js"></script>
    <script src="assets/js/chatbot.js"></script>
  </body>
</html>
