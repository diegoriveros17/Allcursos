<!doctype html>
<html lang="es" class="h-100">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AllCursos - Cursos y capacitaciones</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" /> <!-- Adelanta la conexión con Google Fonts para que las letras carguen antes -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body class="d-flex flex-column h-100" id="page-container-1">
    <header data-bs-theme="light">
      <nav class="navbar navbar-expand-lg bg-body-tertiary fixed-top border-bottom shadow-sm">
        <div class="container-fluid">
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarsExample11"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div
            class="navbar-collapse d-lg-flex justify-content-between collapse show"
            id="navbarsExample11"
          >
            <!-- Lista de navegación común -->
            <ul class="navbar-nav col-lg-8" id="menuDinamico">
              <!-- El contenido de aquí adentro se va a generar solo por JavaScript en todas las páginas -->
            </ul>
          </div>
        </div>
      </nav>
    </header>

    <main>
      <!-- Banner principal con degradé de la marca -->
      <section class="hero-banner hero-inicio text-white">
        <div class="container">
          <span class="badge hero-etiqueta mb-3">
            <i class="bi bi-stars me-1"></i>PLATAFORMA DE CAPACITACIÓN
          </span>
          <h1 class="hero-titulo mb-3">Formación profesional,<br class="d-none d-md-inline" /> al alcance de todos</h1>
          <p class="hero-subtitulo mb-0">
            Encontrá cursos de instituciones de tu ciudad, inscribite en minutos
            y descargá tu certificado al finalizar.
          </p>
        </div>
      </section>

      <!-- Buscador destacado: queda "montado" entre el banner y el listado -->
      <div class="container buscador-contenedor">
        <form class="buscador-principal" id="formBuscador" role="search" autocomplete="off">
          <i class="bi bi-search buscador-icono"></i>
          <label class="visually-hidden" for="terminoBusqueda">Buscar cursos</label>
          <input
            type="search"
            id="terminoBusqueda"
            placeholder="Buscar por título, institución o categoría..."
          />
          <span class="buscador-separador d-none d-md-block"></span>
          <button class="btn btn-buscar" type="submit" id="btnBuscar">
            Buscar cursos<i class="bi bi-arrow-right ms-2"></i>
          </button>
        </form>
      </div>

      <section class="container py-5" id="cursos">
        <div class="row g-4">
          <!-- Panel de filtros (en celular se despliega con un botón) -->
          <aside class="col-lg-3">
            <button
              class="btn btn-outline-secondary w-100 d-lg-none mb-2"
              type="button"
              data-bs-toggle="collapse"
              data-bs-target="#panelFiltrosColapsable"
              aria-expanded="false"
              aria-controls="panelFiltrosColapsable"
            >
              <i class="bi bi-funnel me-1"></i>Filtros
            </button>
            <div class="collapse d-lg-block" id="panelFiltrosColapsable">
              <div class="panel-filtros">
                <div class="panel-filtros-cabecera">
                  <span class="panel-filtros-titulo">
                    <i class="bi bi-funnel"></i>Filtros
                    <span class="badge rounded-pill contador-filtros d-none" id="contadorFiltros">0</span>
                  </span>
                  <button type="button" class="btn btn-link btn-borrar-filtros d-none" id="btnLimpiarFiltros">
                    Borrar filtros
                  </button>
                </div>
                <div class="chips-filtros d-none" id="chipsFiltros"></div>

                <details class="grupo-filtro" open>
                  <summary><span><i class="bi bi-display"></i>Modalidad</span><i class="bi bi-chevron-down flecha"></i></summary>
                  <div class="opciones-filtro" id="listaModalidades"></div>
                </details>

                <details class="grupo-filtro" open>
                  <summary><span><i class="bi bi-tags"></i>Categoría</span><i class="bi bi-chevron-down flecha"></i></summary>
                  <div class="opciones-filtro" id="listaCategorias"></div>
                </details>
              </div>
            </div>
          </aside>

          <!-- Resultados -->
          <div class="col-lg-9">
            <div class="cabecera-resultados">
              <p class="mb-0" id="contadorResultados" aria-live="polite">Cargando cursos...</p>
              <div class="d-flex align-items-center gap-2">
                <label class="small text-muted text-nowrap" for="ordenCursos">Ordenar por</label>
                <select class="form-select select-orden" id="ordenCursos">
                  <option value="recomendados">Recomendados</option>
                  <option value="populares">Más populares</option>
                  <option value="titulo">Título (A–Z)</option>
                  <option value="vacantes">Más vacantes</option>
                </select>
              </div>
            </div>

            <div class="row row-cols-1 row-cols-md-2 row-cols-xl-3 g-4" id="cardCursos"></div>
          </div>
        </div>
      </section>
    </main>
    <footer class="bg-white border-top py-4 mt-auto">
      <div class="container text-center">
        <p class="mb-0 fw-semibold text-dark">&copy; AllCursos 2026</p>
      </div>
    </footer>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/navbar.js"></script>
    <script src="assets/js/ui.js"></script> <!-- Efectos visuales comunes (scroll, volver arriba) -->
    <script src="assets/js/app.js"></script>
    <script src="assets/js/chatbot.js"></script>
  </body>
</html>
