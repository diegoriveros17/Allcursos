<!doctype html>
<html lang="es" class="h-100">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Estadísticas de la encuesta - AllCursos</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <style>
      .grafico-contenedor { position: relative; height: 300px; }
      .grafico-contenedor.alto { height: 360px; }
      .lista-scroll { max-height: 340px; overflow-y: auto; }
      .texto-respuesta { white-space: pre-wrap; word-break: break-word; }
    </style>
  </head>
  <body class="d-flex flex-column h-100 bg-light">
    <header data-bs-theme="light">
      <nav class="navbar navbar-expand-lg bg-body-tertiary fixed-top border-bottom shadow-sm">
        <div class="container-fluid">
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarsExample11">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="navbar-collapse d-lg-flex justify-content-between collapse show" id="navbarsExample11">
            <ul class="navbar-nav col-lg-8" id="menuDinamico"></ul>
          </div>
        </div>
      </nav>
    </header>

    <main class="container my-5 pt-5">
      <a href="dashboard.html" class="btn btn-sm btn-outline-secondary mb-3">
        <i class="bi bi-arrow-left me-1"></i>Volver al panel
      </a>

      <div id="cabeceraEncuesta">
        <div class="text-center text-muted py-5">
          <div class="spinner-border" role="status"></div>
          <p class="mt-2">Cargando estadísticas...</p>
        </div>
      </div>

      <div id="resultadosPreguntas"></div>
    </main>

    <footer class="bg-white border-top py-4 mt-auto">
      <div class="container text-center">
        <p class="mb-0 fw-semibold text-dark">&copy; AllCursos 2026</p>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Chart.js (versión fija para que un cambio del CDN no rompa los gráficos) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/dom_utils.js"></script>
    <script src="assets/js/navbar.js"></script>
    <script src="assets/js/estadisticas_encuesta.js"></script>
  </body>
</html>
